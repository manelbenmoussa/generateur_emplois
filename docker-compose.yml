services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: generateur
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  web:
    build: .
    environment:
      NODE_ENV: production
      # Point the app to the DB; adjust host if running differently
      DATABASE_URL: postgres://postgres:postgres@db:5432/generateur
    ports:
      - "3000:3000"
    depends_on:
      - db

  adminer:
    image: adminer
    restart: always
    ports:
      - "8081:8081"

volumes:
  db_data:
